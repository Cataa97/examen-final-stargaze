<!doctype html>
<html lang="es">
  <head>
    <link rel="stylesheet" type="text/css" href="/static/style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Publicación - Stargaze</title>
  </head>
  <body>
    <div class="contenedor">
      <h1>Editar Publicación</h1>

      <div class="tarjeta">
        {% with messages = get_flashed_messages() %} {% if messages %}
        <ul class="mensajes-flash">
          {% for message in messages %}
          <li>{{ message }}</li>
          {% endfor %}
        </ul>
        {% endif %} {% endwith %}

        <form action="/procesar_editar/{{ pub.id }}" method="POST">
          <div class="grupo-formulario">
            <input
              type="text"
              name="nombre"
              class="campo-texto"
              placeholder="Nombre de Estrella/Constelación"
              value="{{ pub.nombre }}"
              required
            />
          </div>

          <div class="grupo-formulario">
            <input
              type="date"
              name="fecha"
              class="campo-texto"
              value="{{ pub.fecha.strftime('%Y-%m-%d') if pub.fecha else '' }}"
              required
            />
          </div>

          <div class="grupo-formulario">
            <input
              type="text"
              name="lugar"
              class="campo-texto"
              placeholder="Lugar de Encuentro"
              value="{{ pub.lugar }}"
              required
            />
          </div>

          <div class="grupo-formulario">
            <textarea
              name="descripcion"
              class="campo-texto area-texto"
              placeholder="Descripción del encuentro"
              required
            >
{{ pub.descripcion }}</textarea
            >
          </div>

          <div class="contenedor-boton">
            <button type="submit" class="boton-guardar">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
